name: Tests
on:
  push:
      branches-ignore:
        - develop
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: php-actions/composer@v6
        with:
          php_version: "8.4"
      - name: PHPUnit Tests
        run: php vendor/bin/phpunit --coverage-text
        env:
          XDEBUG_MODE: coverage
